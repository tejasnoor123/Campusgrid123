version: "3.9"

# Production overrides — extends docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:

  backend:
    image: ${DOCKER_USERNAME}/campusgrid-backend:latest
    restart: always
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 4
    volumes:
      - results_data:/app/results
    environment:
      - RESULTS_DIR=/app/results




  frontend:
    image: ${DOCKER_USERNAME}/campusgrid-frontend:latest
    restart: always

  postgres:
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Remove the schema init volume in prod — run migrations manually

  redis:
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
  results_data:
